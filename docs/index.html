<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05080f" />
  <title>势能雷达 · 清晰上升趋势</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e6b450' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffd479'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css?v=34" />
  <script defer src="./app.js?v=34"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="势能雷达首页">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-name">势能雷达</span>
        <span class="brand-sub">CLEAR UPTREND</span>
      </span>
    </a>
    <div class="topbar-controls">
      <label class="sr-only" for="board">板块</label>
      <select id="board" class="control">
        <option value="all">全部板块</option>
        <option value="主板">主板</option>
        <option value="创业板">创业板</option>
        <option value="科创板">科创板</option>
        <option value="北交所">北交所</option>
      </select>
      <label class="sr-only" for="search">代码或名称</label>
      <input id="search" class="control control-search" type="search" placeholder="代码 / 名称" autocomplete="off" />
      <label class="sr-only" for="archive-select">历史档案</label>
      <select id="archive-select" class="control"><option value="">最新</option></select>
      <button id="back-latest" class="control control-btn" type="button" hidden>返回最新</button>
      <button id="refresh-button" class="control control-btn control-primary" type="button">刷新</button>
    </div>
  </header>

  <section class="wealth" aria-label="今日概览">
    <div class="wealth-left">
      <div class="wealth-date" id="as-of">—</div>
      <div class="wealth-sub">
        清晰上升趋势 <b class="gold" id="trend-count">—</b> 只
        <span class="dot">·</span> 覆盖 <span id="universe-count">—</span> 只
      </div>
    </div>
    <div class="wealth-metrics">
      <div class="wm"><strong id="avg-gain" class="up">—</strong><span>平均 60 日涨幅</span></div>
      <div class="wm"><strong id="max-gain">—</strong><span>最高 60 日涨幅</span></div>
      <div class="wm"><strong id="avg-mdd" class="down">—</strong><span>平均最大回撤</span></div>
    </div>
  </section>

  <div id="data-warning" class="warning" hidden></div>

  <main class="board">
    <table class="signals-table">
      <thead id="signals-head">
        <tr>
          <th class="col-rank">#</th>
          <th class="col-name">标的</th>
          <th class="col-spark c-spark">60日走势</th>
          <th class="col-num sortable" data-sort="close">现价</th>
          <th class="col-num sortable c-gain" data-sort="gain_60_pct">60日涨幅</th>
          <th class="col-num sortable" data-sort="mdd_pct">最大回撤</th>
          <th class="col-num sortable c-ext" data-sort="ext_pct">距MA20</th>
          <th class="col-num c-limit">涨停</th>
        </tr>
      </thead>
      <tbody id="signals-body"></tbody>
    </table>
    <div id="empty-state" class="empty" hidden></div>
  </main>

  <footer class="footer">
    <p id="footer-note">研究预警，不构成投资建议。信号为规则化统计筛选，不代表未来收益。</p>
  </footer>
</body>
</html>
