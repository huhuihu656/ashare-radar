[project]
name = "ashare-close-monitor"
version = "0.1.0"
description = "A-share end-of-session research signal scanner (no trading)"
requires-python = ">=3.10"
dependencies = [
  "akshare>=1.14",
  "pandas>=2.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "tenacity>=8.2",
  "rich>=13.0",
]

[project.scripts]
ashare-monitor = "ashare_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
