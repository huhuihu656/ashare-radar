# 研究预警扫描器配置。免费行情源仅提供量价数据，"资金进入"均为量价代理。
scan:
  workers: 8
  lookback_days: 320
  min_history_days: 150
  exclude_st: true
  include_boards: ["主板", "创业板", "科创板", "北交所"]
  cache_dir: "data/cache"
  output_dir: "data/reports"

# 共性风控：6 个月涨幅上限（本信号仍在使用）。低位分位与量能门槛已随旧形态删除。
risk:
  enabled: true
  position_lookback_days: 120     # 6个月≈120交易日
  max_position_gain_pct: 1.0      # 位置错误：6个月涨幅>100% 形态失效
  weak_market_skip_signals: false
  weak_market_ma: 60

notify:
  enabled: true
  wechat_sendkey: ""      # Server酱 SendKey（例如 SCUxxxx）
  wecom_webhook: ""       # 企业微信机器人 webhook
  pushplus_token: ""      # PushPlus token

# 清晰上升趋势（唯一信号）
# 趋势结构 + K 线规整度 + 非打板情绪，三组条件同时成立才入选。
clear_uptrend:
  enabled: true
  window: 60                 # 判定窗口（交易日）
  ma20_slope_days: 10        # MA20 上行的回看天数
  min_gain_60: 0.10          # 窗口净涨幅下限
  max_ext_pct: 0.08          # 收盘相对 MA20 的最大偏离（不追高）
  min_efficiency: 0.18       # 效率比下限（净涨幅 / 路径总长）
  max_daily_p95: 0.07        # 日涨跌幅绝对值 95 分位上限
  max_drawdown: 0.15         # 窗口内最大回撤上限
  limitup_lookback: 20       # 涨停统计窗口
  max_limit_ups: 1           # 允许的涨停次数
  limit_tolerance: 0.005     # 涨停判定容差（吸收复权/四舍五入误差）
  require_higher_swings: false  # 是否强制三段低点/高点同步抬高
  min_history_days: 150
